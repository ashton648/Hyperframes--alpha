<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alpha Hawthorn Physio Tile</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002E6B;
    --navy-deep: #00214F;
    --orange: #F15F2E;
    --orange-on-cream: #D4512A;
    --cream: #FEF1E1;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 900px; background: var(--navy); }
  body { font-family: Montserrat, sans-serif; color: var(--white); overflow: hidden; }

  .tile { position: relative; width: 1200px; height: 900px; overflow: hidden;
    background: radial-gradient(120% 90% at 0% 0%, #013A85 0%, var(--navy) 45%, var(--navy-deep) 100%); }

  /* cream wedge, end-card style */
  .wedge { position: absolute; right: -260px; top: -140px; width: 760px; height: 1300px;
    background: var(--cream); border-left: 14px solid var(--orange); transform: rotate(14deg); }

  .logo { position: absolute; left: 72px; top: 60px; height: 64px; }

  .copy { position: absolute; left: 72px; top: 158px; width: 640px; }
  .kicker { display: inline-block; background: var(--orange); color: var(--white);
    font-weight: 900; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 10px 16px 9px; border-radius: 6px; }
  h1 { margin-top: 24px; font-weight: 900; font-size: 86px; line-height: 0.95;
    letter-spacing: -0.035em; text-transform: uppercase; }
  h1 .o { color: var(--orange); }
  .rule { width: 120px; height: 8px; background: var(--orange); margin: 26px 0 22px; }
  .intro { font-weight: 700; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: #B9CBE6; }
  .name { margin-top: 8px; font-weight: 900; font-size: 54px; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1; }
  .role { margin-top: 12px; font-weight: 800; font-size: 26px; line-height: 1.3; }
  .role .o { color: var(--orange); }

  /* right: triathlon disciplines stacked on the cream wedge */
  .tri { position: absolute; right: 64px; top: 140px; width: 330px; display: flex; flex-direction: column; gap: 18px; }
  .disc { display: flex; align-items: center; gap: 18px; background: var(--navy); border-radius: 14px;
    padding: 18px 22px; box-shadow: 0 8px 0 var(--orange); }
  .disc svg { width: 54px; height: 54px; flex: none; }
  .disc span { font-weight: 900; font-size: 34px; letter-spacing: -0.01em; text-transform: uppercase; }
  .disc.recover { background: var(--orange); box-shadow: 0 8px 0 var(--navy); }

  .cta { position: absolute; right: 64px; top: 606px; width: 330px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
  .btn { background: var(--orange); color: var(--white); font-weight: 900; font-size: 28px;
    text-transform: uppercase; letter-spacing: 0.02em; padding: 20px 20px; border-radius: 10px; text-align: center; background: var(--navy-deep); box-shadow: 0 8px 0 var(--orange); }
  .where { margin-top: 6px; text-align: center; font-weight: 800; font-size: 18px; letter-spacing: 0.1em; white-space: nowrap; text-transform: uppercase; color: var(--navy); }
  .where b { color: var(--orange-on-cream); font-weight: 900; }
</style>
</head>
<body>
<div class="tile">
  <div class="wedge"></div>

  <img class="logo" src="assets/alpha-logo.png" alt="Alpha Sports Medicine">

  <div class="copy">
    <span class="kicker">Now open · Hawthorn</span>
    <h1>Physio has<br><span class="o">arrived</span> at<br>Alpha <span class="o">Hawthorn</span></h1>
    <div class="rule"></div>
    <div class="intro">Introducing</div>
    <div class="name">Grace Thek</div>
    <div class="role">Experienced physiotherapist<br>&amp; <span class="o">world-class triathlete</span></div>
  </div>

  <div class="tri">
    <div class="disc">
      <svg viewBox="0 0 64 64" fill="none" stroke="#F15F2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="46" cy="18" r="6"/>
        <path d="M10 34 L24 24 L34 30 L40 26"/>
        <path d="M6 46 q6 -6 12 0 t12 0 t12 0 t12 0 t6 0"/>
      </svg>
      <span>Swim</span>
    </div>
    <div class="disc">
      <svg viewBox="0 0 64 64" fill="none" stroke="#F15F2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15" cy="44" r="10"/><circle cx="49" cy="44" r="10"/>
        <path d="M15 44 L26 26 L40 26 L49 44 M26 26 L33 44 L40 26 M24 18 h8"/>
      </svg>
      <span>Bike</span>
    </div>
    <div class="disc">
      <svg viewBox="0 0 64 64" fill="none" stroke="#F15F2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="38" cy="10" r="6"/>
        <path d="M22 26 L34 20 L40 32 L50 34 M34 20 L28 38 L38 46 L36 58 M28 38 L18 50 L8 48"/>
      </svg>
      <span>Run</span>
    </div>
    <div class="disc recover">
      <svg viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 54 C12 40 6 30 6 20 a12 12 0 0 1 26 -4 a12 12 0 0 1 26 4 c0 10 -6 20 -26 34z"/>
        <path d="M18 30 h8 l4 -8 l6 16 l4 -8 h6"/>
      </svg>
      <span>Recover</span>
    </div>
  </div>

  <div class="cta">
    <div class="btn">Book now</div>
    <div class="where"><b>Hawthorn</b> · Sports physio</div>
  </div>
</div>
</body>
</html>
